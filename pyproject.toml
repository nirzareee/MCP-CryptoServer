[project]
name = "mcp-crypto-server"
version = "0.1.0"
description = "An MCP server that gives Claude access to live cryptocurrency market data. Built with the MCP Python SDK and the public CoinGecko API."
readme = "README.md"
authors = [
    { name = "Nirzaree Devasthale", email = "nirzareenikhil.devasthale@stonybrook.edu" }
]
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.28.1",
    "mcp[cli]<2",
    "python-dotenv>=1.2.3",
]

[project.scripts]
mcp-crypto-server = "mcp_crypto_server:main"

[build-system]
requires = ["uv_build>=0.12.7,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "respx>=0.23.1",
]


[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-v --strict-markers"
